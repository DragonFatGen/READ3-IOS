name: Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:



permissions:
  contents: read

jobs:
  windows-core-tests:
    name: Windows / Swift 6.3.3
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # swift-actions/setup-swift v3 does not support Windows.
      # Use the Windows-specific Swift setup action instead.
      - name: Install Swift 6.3.3
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Show Swift environment
        shell: pwsh
        run: |
          swift --version
          where.exe swift

      - name: Test LegadoCore
        shell: pwsh
        run: |
          swift test --package-path Packages/LegadoCore

          if ($LASTEXITCODE -ne 0) {
            throw "LegadoCore tests failed with exit code $LASTEXITCODE"
          }

  macos-core-tests:
    name: macOS / Xcode Swift
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # macOS runner already contains Xcode and its bundled Swift toolchain.
      # Testing with the Xcode toolchain is also closer to the actual iOS build.
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Test LegadoCore
        run: |
          set -o pipefail
          swift test --package-path Packages/LegadoCore