name: Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / Swift 6.0
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The public setup action installs an auditable Swift.org toolchain because
      # GitHub's Windows image does not guarantee the required Swift version.
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Show Swift version
        shell: pwsh
        run: swift --version

      - name: Test LegadoCore
        shell: pwsh
        run: swift test --package-path Packages/LegadoCore

  macos:
    name: macOS / Swift 6.0
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Show Swift version
        run: swift --version

      - name: Test LegadoCore
        run: swift test --package-path Packages/LegadoCore
